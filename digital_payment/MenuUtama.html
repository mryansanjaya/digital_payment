{% block styles %}
    <link href="{{ static 'fontawesome/css/all.css' }}" rel="stylesheet"/>
    <link href="{{ static 'fontawesome/css/solid.css' }}" rel="stylesheet"/>
    <link href="{{ static 'fontawesome/css/brands.css' }}" rel="stylesheet"/>
{% endblock %}

{% block title %}
    <title>Menu Utama</title>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Menu Utama</h3>
        </div>
        <div class="card-body">

            <p class="fs-5">Silakan pilih salah satu platform untuk dilanjutkan:</p>

            <form method="post">
    <button type="submit" name="menu_choice" value="pasar_riil" class="btn btn-success">Platform Pasar Tradisional</button>
    <button type="submit" name="menu_choice" value="pasar_digital" class="btn btn-primary">Platform Pasar Digital</button>
    <button type="submit" name="menu_choice" value="investasi" class="btn btn-warning">Platform Investasi</button>
</form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
