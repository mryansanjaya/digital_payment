{% block styles  %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="{% static 'fontawesome/css/all.css' %}" rel="stylesheet"/>
    <link href="{% static 'fontawesome/css/solid.css' %}" rel="stylesheet"/>
    <link href="{% static 'fontawesome/css/brands.css' %}" rel="stylesheet"/>
    <link href="{% static 'global/media_queries.css' %}" rel="stylesheet"/>
{% endblock %}

{% block title %}
    <title>Digital Payment Experiment</title>
{% endblock %}

{% block content %}
    <div class="container">
        <div class="card">
            <div class="card-header text-center">
                <h5 class="m-0">
                    Digital Payment Experiment
                </h5>
            </div>
            <div class="card-body">
                <div class="row justify-content-center align-items-center mb-3">
                    <img src="{% static 'img/ugm-logo.png' %}" class="img-fluid w-25" alt="image">
                    <img src="{% static 'img/bank_indonesia.png' %}" class="img-fluid w-50" alt="image">
                </div>
                <div class="card-title text-center">
                    <strong class="fs-4">
                        Selamat Datang di eksperimen
                    </strong>
                    <h3>
                        Digital Payment Experiment
                    </h3>
                    <p>
                        Silahkan klik "Lanjut menuju Eksperimen" untuk melanjutkan
                    </p>
                </div>
            </div>
            <div class="card-footer text-center">
                <button class="otree-btn btn btn-primary bg-gradient">
                    <i class="fa-solid fa-forward"></i>
                    <span>Lanjut</span>
                </button>
            </div>
        </div>
    </div>
{% endblock %}
