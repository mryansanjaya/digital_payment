{% block styles %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
          crossorigin="anonymous">
    <link href="{% static 'fontawesome/css/all.css' %}" rel="stylesheet"/>
    <link href="{% static 'fontawesome/css/solid.css' %}" rel="stylesheet"/>
    <link href="{% static 'fontawesome/css/brands.css' %}" rel="stylesheet"/>
    <link href="{% static 'global/custom_css.css' %}" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
            integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
{% endblock %}

{% block title %}
    <title>Digital Payment Experiment</title>
{% endblock %}

{% block content %}
    <div class="container p-0">
        <div class="card">
            <div class="card-header text-center">
                <span class="fs-6 m-0">
                    Digital Payment Experiment
                </span>
            </div>
            <div class="card-body">
                <div class="container">
                    <div class="d-flex flex-row flex-wrap justify-content-center align-items-center mb-3">
                        <img src="{% static 'img/ugm-logo.png' %}" class="img-fluid ugm-logo-size" alt="image">
                        <img src="{% static 'img/bank_indonesia.png' %}" class="img-fluid bi-logo-size" alt="image">
                    </div>
                </div>
                <div class="card-title text-center">
                    <span class="fs-5">
                        Selamat Datang di eksperimen
                    </span>
                    <h3>
                        Digital Payment Experiment
                    </h3>
                    <p>
                        Silahkan klik "Lanjut menuju Eksperimen" untuk melanjutkan
                    </p>
                </div>
            </div>
            <div class="card-footer text-center">
                <button class="otree-btn btn btn-primary bg-gradient">
                    <i class="fa-solid fa-forward"></i>
                    <span>Lanjut menuju Eksperimen</span>
                </button>
            </div>
        </div>
    </div>
{% endblock %}
